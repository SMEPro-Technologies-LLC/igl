name: Release

# A release is cut one of two ways:
#   1. Push a tag v<version> that matches package.json.
#   2. Actions > Release > Run workflow. The run creates the tag from main
#      for the version in package.json, so nothing is tagged by hand.
# Either way the suite runs first, then the GitHub release is published with
# the npm tarball, the OpenAPI contract and checksums, with notes taken from
# that version's CHANGELOG section. The package is published to npm when an
# NPM_TOKEN secret exists; without one that step is skipped and reported.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Version
        id: v
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1
          fi
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag from main when started by hand
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then echo "tag v$VERSION exists"; exit 0; fi
          git config user.name "igl-release[bot]"; git config user.email "release@id-me.ai"
          git tag -a "v$VERSION" -m "IGL $VERSION"
          git push origin "v$VERSION"
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "::error::empty release notes for $VERSION"; exit 1; }
      - name: Pack and checksum
        run: |
          npm pack
          sha256sum *.tgz spec/openapi.yaml > SHA256SUMS
      - name: GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: IGL ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            *.tgz
            spec/openapi.yaml
            SHA256SUMS
      - name: Publish to npm with provenance
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: npm publish skipped
        if: ${{ env.NODE_AUTH_TOKEN == '' }}
        run: echo "::notice::No NPM_TOKEN secret, so the package was not published to npm. Add one under Settings, Secrets and variables, Actions, then run this workflow again."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
