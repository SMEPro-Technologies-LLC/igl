name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test suite (bridge, decode, extract, graph, igl, sign, store)
        run: npm test
      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  contract:
    name: Platform contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Lint spec/openapi.yaml
        run: npx --yes @redocly/cli@1 lint spec/openapi.yaml --format=github-actions
      - name: Service OpenAPI is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('provision/openapi.json','utf8'))"

  # The branch rule on main requires a check named "test". This job carries
  # that name and passes only when the unit tests on both Node versions and
  # the contract checks have passed.
  test:
    name: test
    needs: [unit, contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          echo "unit: ${{ needs.unit.result }}, contract: ${{ needs.contract.result }}"
          [ "${{ needs.unit.result }}" = "success" ] && [ "${{ needs.contract.result }}" = "success" ]
