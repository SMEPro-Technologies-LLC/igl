name: Deploy id-me.ai

# Publishes platform/site to the Cloudflare Pages project "id-me-ai" whenever
# main changes it. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   (Cloudflare Pages: Edit, D1: Edit)
#   CLOUDFLARE_ACCOUNT_ID  (8608c0d4577e253102798af8a09ea644)

on:
  push:
    branches: [main]
    paths:
      - "platform/site/**"
      - "platform/api/implemented.json"
      - "spec/openapi.yaml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Pages deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Reference is current with the contract
        run: |
          pip install --quiet pyyaml
          cp platform/site/index.html /tmp/index.before.html
          python3 platform/site/gen_reference.py spec/openapi.yaml platform/api/implemented.json platform/site/index.html
          if ! diff -q /tmp/index.before.html platform/site/index.html >/dev/null; then
            echo "::error::platform/site/index.html is out of date; run gen_reference.py and commit the result"; exit 1
          fi
      - name: Apply intake schema (idempotent)
        run: npx --yes wrangler@4 d1 execute igl-intake --remote --file=platform/site/schema/intake.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy platform/site --project-name id-me-ai --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
