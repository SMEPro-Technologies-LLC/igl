name: Deploy API

# Deploys platform/api as two Workers on the id-me.ai zone:
#   sandbox    -> sandbox.id-me.ai            (every push to main)
#   production -> api.id-me.ai, auth.id-me.ai (after sandbox, same commit)
# then starts the site deploy, which regenerates the API reference from what
# the two hosts report they serve.
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN   Workers Scripts: Edit, Workers Routes: Edit, D1: Edit, Pages: Edit, Zone: Read
#   CLOUDFLARE_ACCOUNT_ID  8608c0d4577e253102798af8a09ea644
# Worker secrets are set once by a maintainer with wrangler (see platform/api/README.md):
#   ANTHROPIC_API_KEY, BOOTSTRAP_TOKEN, optionally SIGNING_KEY_PEM

on:
  push:
    branches: [main]
    paths:
      - "platform/api/**"
      - "!platform/api/implemented.json"
      - "spec/openapi.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  test:
    name: Conformance (local workerd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - name: Routes are generated from the contract
        run: |
          pip install --quiet pyyaml==6.0.3
          python3 scripts/gen-routes.py ../../spec/openapi.yaml /tmp/routes.generated.js
          diff -q /tmp/routes.generated.js src/routes.generated.js || { echo "::error::src/routes.generated.js is out of date; run scripts/gen-routes.py"; exit 1; }
      - run: npm test

  sandbox:
    name: Deploy sandbox
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npx wrangler d1 execute igl-api-sandbox --remote --env sandbox --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --env sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://sandbox.id-me.ai/v1/health; then exit 0; fi; sleep 10
          done; echo "::error::sandbox did not answer"; exit 1

  production:
    name: Deploy production
    needs: sandbox
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: platform/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npx wrangler d1 execute igl-api-production --remote --env production --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://api.id-me.ai/v1/health; then exit 0; fi; sleep 10
          done; echo "::error::production did not answer"; exit 1

  record:
    name: Publish the reference
    needs: [sandbox, production]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start the site deploy, which reads what both hosts serve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-site.yml --ref main
