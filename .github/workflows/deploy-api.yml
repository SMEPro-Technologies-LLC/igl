name: Deploy API

# Deploys platform/api as two Workers on the id-me.ai zone:
#   sandbox    -> sandbox.id-me.ai            (every push to main)
#   production -> api.id-me.ai, auth.id-me.ai (after sandbox, same commit)
# then records what is served in platform/api/implemented.json and commits it,
# which makes the site's API reference show live status.
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN   Workers Scripts: Edit, Workers Routes: Edit, D1: Edit, Pages: Edit, Zone: Read
#   CLOUDFLARE_ACCOUNT_ID  8608c0d4577e253102798af8a09ea644
# Worker secrets are set once by a maintainer with wrangler (see platform/api/README.md):
#   ANTHROPIC_API_KEY, BOOTSTRAP_TOKEN, optionally SIGNING_KEY_PEM

on:
  push:
    branches: [main]
    paths:
      - "platform/api/**"
      - "!platform/api/implemented.json"
      - "spec/openapi.yaml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  test:
    name: Conformance (local workerd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - name: Routes are generated from the contract
        run: |
          pip install --quiet pyyaml
          python3 scripts/gen-routes.py ../../spec/openapi.yaml /tmp/routes.generated.js
          diff -q /tmp/routes.generated.js src/routes.generated.js || { echo "::error::src/routes.generated.js is out of date; run scripts/gen-routes.py"; exit 1; }
      - run: npm test

  sandbox:
    name: Deploy sandbox
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npx wrangler d1 execute igl-api-sandbox --remote --env sandbox --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --env sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://sandbox.id-me.ai/v1/health; then exit 0; fi; sleep 10
          done; echo "::error::sandbox did not answer"; exit 1

  production:
    name: Deploy production
    needs: sandbox
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: platform/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npx wrangler d1 execute igl-api-production --remote --env production --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://api.id-me.ai/v1/health; then exit 0; fi; sleep 10
          done; echo "::error::production did not answer"; exit 1

  record:
    name: Record what is served
    needs: [sandbox, production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Merge the two deployments' operation lists into implemented.json
        run: |
          curl -fsS https://api.id-me.ai/admin/implemented > /tmp/prod.json
          curl -fsS https://sandbox.id-me.ai/admin/implemented > /tmp/sandbox.json
          python3 - <<'EOF'
          import json
          prod = json.load(open('/tmp/prod.json')); sb = json.load(open('/tmp/sandbox.json'))
          out = {"deployed": True, "live": sorted(prod["live"]), "sandbox": sorted(sb["sandbox"])}
          json.dump(out, open('platform/api/implemented.json', 'w'), indent=2); open('platform/api/implemented.json', 'a').write("\n")
          EOF
          pip install --quiet pyyaml
          python3 platform/site/gen_reference.py spec/openapi.yaml platform/api/implemented.json platform/site/index.html
      - name: Commit if changed, then redeploy the site so the reference shows what is served
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "igl-deploy[bot]"; git config user.email "deploy@id-me.ai"
          git add platform/api/implemented.json platform/site/index.html
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "deploy: record served operations for the site reference"
          git push
          gh workflow run deploy-site.yml --ref main
