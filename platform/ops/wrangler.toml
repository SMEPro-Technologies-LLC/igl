# IGL operator console at ops.id-me.ai. Behind Cloudflare Access.
#   npx wrangler deploy
# Secrets (wrangler secret put <NAME>):
#   CLOUDFLARE_API_TOKEN  Zone Analytics: Read, Zone: Read on id-me.ai (site traffic)
#   GITHUB_TOKEN          classic or fine-grained token with push access to the repo (traffic, clones); optional
# Vars ACCESS_TEAM_DOMAIN and ACCESS_AUD come from the Access application you create for ops.id-me.ai.
name = "igl-ops"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# ops.id-me.ai is a Cloudflare Custom Domain; the first deploy creates its DNS record and certificate.
routes = [
  { pattern = "ops.id-me.ai", custom_domain = true },
]

[observability]
enabled = true

[vars]
ZONE_NAME = "id-me.ai"
GITHUB_REPO = "SMEPro-Technologies-LLC/igl"
MENTION_QUERY = "id-me.ai"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
NPM_PACKAGE = ""

[[d1_databases]]
binding = "INTAKE"
database_name = "igl-intake"
database_id = "f8bfa36d-aa8b-45f2-b177-6f43deaabd7a"

[[d1_databases]]
binding = "API_PROD"
database_name = "igl-api-production"
database_id = "9cb410a2-45a4-4a60-bea5-3400afccbc96"

[[d1_databases]]
binding = "API_SANDBOX"
database_name = "igl-api-sandbox"
database_id = "9eb93da4-4bd4-4686-97db-9d407b5a11ed"
