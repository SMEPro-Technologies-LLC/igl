openapi: 3.1.0
info:
  title: IGL Governed Identity Platform API
  version: 0.2.0
  summary: Transform identity into governed intelligence.
  description: 'The API contract for Identity Governed Logic (IGL). The API exposes governed identity, authority, knowledge,
    policy, evidence, outcome, graph, query, research, agent, workflow, and audit services. It is model-agnostic: reasoning
    providers can be changed without changing the governed intelligence contract. Version 0.2 adds purpose-bounded projections:
    purpose profiles, identity projections with per-node gate explanations, obligations with attestation status, caller resolution,
    consent records, and interaction records, so applications and model callers share one governance model.'
  contact:
    name: SMEPro Technologies, LLC
    url: https://www.smeprotech.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: https://api.id-me.ai/v1
  description: Production
- url: https://sandbox.id-me.ai/v1
  description: Sandbox
tags:
- name: Identity
  description: Resolve identities, context, and relationships.
- name: Projection
  description: 'Purpose-bounded projections of an identity: what a caller may see, why, and what was withheld.'
- name: Authority
  description: Evaluate access, roles, delegations, and decision authority.
- name: Knowledge
  description: Create and retrieve governed entities and facts.
- name: Policy
  description: Create policies and evaluate governed actions.
- name: Evidence
  description: Capture provenance, citations, corroboration, and findings.
- name: Outcomes
  description: Record decisions, actions, measurements, and feedback.
- name: Graph
  description: Traverse and manage governed graph relationships.
- name: Intelligence
  description: Run governed queries, research, crosswalks, and investigations.
- name: Agents
  description: Register and invoke governed agents.
- name: Workflows
  description: Define and run governed workflows.
- name: Audit
  description: Retrieve immutable activity and runtime receipts.
- name: System
  description: Service health and capability discovery.
security:
- oauth2:
  - igl.read
paths:
  /health:
    get:
      summary: Check service health
      operationId: getHealth
      tags:
      - System
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /capabilities:
    get:
      summary: Discover platform capabilities
      operationId: getCapabilities
      tags:
      - System
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters: &id019
      - &id001
        $ref: '#/components/parameters/TenantId'
      - &id002
        $ref: '#/components/parameters/RequestId'
  /identities:
    get:
      summary: List or search identities
      operationId: listIdentities
      tags:
      - Identity
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - *id001
      - *id002
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: q
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/IdentityType'
    post:
      summary: Create an identity
      operationId: createIdentity
      tags:
      - Identity
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400': &id003
          $ref: '#/components/responses/BadRequest'
        '401': &id004
          $ref: '#/components/responses/Unauthorized'
        '403': &id005
          $ref: '#/components/responses/Forbidden'
        '409': &id006
          $ref: '#/components/responses/Conflict'
        '422': &id007
          $ref: '#/components/responses/Unprocessable'
        '429': &id008
          $ref: '#/components/responses/TooManyRequests'
      parameters: &id020
      - *id001
      - *id002
      - &id009
        $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityCreate'
      security:
      - oauth2:
        - igl.write
      - apiKey: []
  /identities/me:
    get:
      summary: Resolve the calling identity under a purpose
      operationId: whoami
      tags:
      - Identity
      - Projection
      description: The REST equivalent of the MCP whoami tool. Returns the caller's own projection bounded by the purpose
        profile.
      parameters:
      - &id010
        $ref: '#/components/parameters/TenantId'
      - &id011
        $ref: '#/components/parameters/RequestId'
      - &id013
        name: purpose
        in: query
        required: true
        schema:
          type: string
        description: Purpose profile id, from GET /purposes. The projection is bounded by what this profile permits.
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projection'
              example:
                identityId: b9d4507a-36ce-4d1b-970d-d85797141ff7
                purpose: identity-introduction
                nodes:
                - id: b9d4507a-36ce-4d1b-970d-d85797141ff7
                  type: Person
                  label: Maria Santos
                  status: certified
                - id: 6b1d3e2a-5a51-4b0c-9a7e-0a2c0e3f9c11
                  type: Role
                  label: Compliance Lead
                  status: certified
                - id: e7bcde63-4ccd-4594-aa64-6de1cce72ae8
                  type: Organization
                  label: Rio Diablo Operating
                  status: certified
                - id: 3d2c1b0a-9f8e-4d7c-b6a5-4e3d2c1b0a99
                  type: Jurisdiction
                  label: US-TX
                  status: certified
                edges: []
                truncated: false
                withheld:
                  Credential: 2
                  Obligation: 3
                  Facility: 1
                governance:
                  receiptId: 0c1d2e3f-4a5b-4c6d-8e9f-0a1b2c3d4e5f
                  actor:
                    identityId: b9d4507a-36ce-4d1b-970d-d85797141ff7
                  authorityDecision:
                    decisionId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    effect: allow
                    evaluatedAt: '2026-10-14T14:02:11Z'
                  policiesEvaluated: []
                  createdAt: '2026-10-14T14:02:11Z'
                createdAt: '2026-10-14T14:02:11Z'
        '401': &id012
          $ref: '#/components/responses/Unauthorized'
        '422': &id015
          $ref: '#/components/responses/Unprocessable'
  /identities/{identityId}:
    get:
      summary: Get an identity
      operationId: getIdentity
      tags:
      - Identity
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - *id001
      - *id002
      - name: identityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update identity attributes
      operationId: updateIdentity
      tags:
      - Identity
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - *id001
      - *id002
      - *id009
      - name: identityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: true
      security:
      - oauth2:
        - igl.write
      - apiKey: []
  /identities/{identityId}/context:
    post:
      summary: Append governed identity context
      operationId: appendIdentityContext
      tags:
      - Identity
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters:
      - *id001
      - *id002
      - *id009
      - name: identityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityContextAppend'
      security:
      - oauth2:
        - igl.write
  /identities/{identityId}/relationships:
    get:
      summary: List identity relationships
      operationId: listIdentityRelationships
      tags:
      - Identity
      - Graph
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipPage'
      parameters:
      - *id001
      - *id002
      - name: identityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /purposes:
    get:
      summary: List purpose profiles
      operationId: listPurposes
      tags:
      - Projection
      description: What each purpose profile permits. Ask for the purpose that matches the task, not the widest one available.
      parameters:
      - *id010
      - *id011
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurposePage'
        '401': *id012
  /purposes/{purposeId}:
    get:
      summary: Get a purpose profile
      operationId: getPurpose
      tags:
      - Projection
      parameters:
      - *id010
      - *id011
      - name: purposeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purpose'
        '404': &id014
          $ref: '#/components/responses/NotFound'
  /identities/{identityId}/projection:
    get:
      summary: Project an identity under a purpose
      operationId: getIdentityProjection
      tags:
      - Projection
      description: 'A deliberately partial view of the identity graph: bounded by the purpose profile, the consent record
        and the cross-border transfer policy. Absence of a node is not evidence the fact is false.'
      parameters:
      - *id010
      - *id011
      - &id016
        name: identityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id013
      - &id017
        name: nodeBudget
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 250
        description: 'Maximum nodes admitted before traversal stops; the response reports truncated: true when reached.'
      - &id018
        name: maxDepth
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 6
          default: 3
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projection'
        '404': *id014
        '422': *id015
  /identities/{identityId}/projection/explain:
    get:
      summary: Explain a projection, node by node
      operationId: explainIdentityProjection
      tags:
      - Projection
      description: 'Every node considered, with the four gates it passed or failed: node type, sensitivity, consent, jurisdiction.
        The first failure is the reason a node was withheld.'
      parameters:
      - *id010
      - *id011
      - *id016
      - *id013
      - *id017
      - *id018
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionExplanation'
        '404': *id014
  /identities/{identityId}/obligations:
    get:
      summary: List obligations in scope for an identity
      operationId: listObligations
      tags:
      - Projection
      - Outcomes
      description: What the person owes to whom by when. status attested means a human reviewed it; proposed means the system
        computed it and nobody has checked. Never present a proposed obligation as a confirmed date.
      parameters:
      - *id010
      - *id011
      - *id016
      - *id013
      - name: status
        in: query
        schema:
          type: string
          enum:
          - attested
          - proposed
      - name: dueBefore
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationPage'
        '404': *id014
        '422': *id015
  /identities/{identityId}/consents:
    get:
      summary: List consent records for an identity
      operationId: listConsents
      tags:
      - Projection
      - Authority
      description: Read-only. Consent is granted and revoked in the control plane, never through this API.
      parameters:
      - *id010
      - *id011
      - *id016
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentPage'
        '404': *id014
  /authority/evaluate:
    post:
      summary: Evaluate authority for an action
      operationId: evaluateAuthority
      tags:
      - Authority
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorityDecision'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id019
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorityEvaluateRequest'
      security:
      - oauth2:
        - igl.execute
  /knowledge/entities:
    post:
      summary: Create a governed knowledge entity
      operationId: createKnowledgeEntity
      tags:
      - Knowledge
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeEntity'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id020
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeEntityCreate'
      security:
      - oauth2:
        - igl.write
  /knowledge/entities/{entityId}:
    get:
      summary: Get a knowledge entity
      operationId: getKnowledgeEntity
      tags:
      - Knowledge
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeEntity'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - *id001
      - *id002
      - name: entityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /knowledge/facts:
    get:
      summary: Search governed facts
      operationId: listFacts
      tags:
      - Knowledge
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactPage'
      parameters:
      - *id001
      - *id002
      - name: subjectId
        in: query
        schema:
          type: string
          format: uuid
      - name: predicate
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    post:
      summary: Create a governed fact
      operationId: createFact
      tags:
      - Knowledge
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id020
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactCreate'
      security:
      - oauth2:
        - igl.write
  /policies:
    post:
      summary: Create a policy
      operationId: createPolicy
      tags:
      - Policy
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id020
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCreate'
      security:
      - oauth2:
        - igl.admin
  /policies/{policyId}:
    get:
      summary: Get a policy
      operationId: getPolicy
      tags:
      - Policy
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - *id001
      - *id002
      - name: policyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /policies/evaluate:
    post:
      summary: Evaluate active policies
      operationId: evaluatePolicies
      tags:
      - Policy
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorityDecision'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id019
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyEvaluateRequest'
      security:
      - oauth2:
        - igl.execute
  /evidence:
    get:
      summary: List evidence
      operationId: listEvidence
      tags:
      - Evidence
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePage'
      parameters:
      - *id001
      - *id002
      - name: status
        in: query
        schema:
          type: string
      - name: kind
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    post:
      summary: Create evidence or a finding
      operationId: createEvidence
      tags:
      - Evidence
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id020
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceCreate'
      security:
      - oauth2:
        - igl.write
  /evidence/{evidenceId}:
    get:
      summary: Get evidence
      operationId: getEvidence
      tags:
      - Evidence
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - *id001
      - *id002
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /evidence/{evidenceId}/corroborate:
    post:
      summary: Corroborate or contradict evidence
      operationId: corroborateEvidence
      tags:
      - Evidence
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters:
      - *id001
      - *id002
      - *id009
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorroborateRequest'
      security:
      - oauth2:
        - igl.write
  /outcomes:
    post:
      summary: Record an outcome
      operationId: createOutcome
      tags:
      - Outcomes
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outcome'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id020
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutcomeCreate'
      security:
      - oauth2:
        - igl.write
  /outcomes/{outcomeId}:
