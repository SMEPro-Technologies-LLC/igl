                - string
                - 'null'
        truncated:
          type: boolean
    Obligation:
      type: object
      required:
      - id
      - subjectId
      - title
      - status
      - dueDate
      properties:
        id:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        title:
          type: string
        obligee:
          type:
          - string
          - 'null'
          description: 'Who it is owed to: a regulator, a counterparty, an internal authority.'
        facilityId:
          type:
          - string
          - 'null'
          format: uuid
          description: The facility or asset that triggers it, when one does.
        regulation:
          type:
          - string
          - 'null'
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - attested
          - proposed
          description: 'attested: a human reviewed it and it is a real deadline. proposed: computed by the system, unchecked.'
        attestedBy:
          oneOf:
          - $ref: '#/components/schemas/ActorRef'
          - type: 'null'
        attestedAt:
          type:
          - string
          - 'null'
          format: date-time
        evidenceIds:
          type: array
          items:
            type: string
            format: uuid
    ObligationPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Obligation'
        page:
          $ref: '#/components/schemas/PageInfo'
    ConsentRecord:
      type: object
      required:
      - id
      - identityId
      - purpose
      - status
      - grantedAt
      properties:
        id:
          type: string
          format: uuid
        identityId:
          type: string
          format: uuid
        purpose:
          type: string
        grantedBy:
          $ref: '#/components/schemas/ActorRef'
        scope:
          type:
          - string
          - 'null'
          description: Applications or workspaces the grant covers.
        jurisdictions:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - active
          - revoked
          - expired
        grantedAt:
          type: string
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
    ConsentPage:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConsentRecord'
        page:
          $ref: '#/components/schemas/PageInfo'
    InteractionRecordCreate:
      type: object
      required:
      - purpose
      - outcome
      properties:
        identityId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'The identity acted for. Omitted: the caller.'
        purpose:
          type: string
        outcome:
          type: string
          enum:
          - completed
          - refused
          - proceeded_on_truncated
          - proceeded_on_empty
          - escalated
        reason:
          type:
          - string
          - 'null'
        projectionReceiptId:
          type:
          - string
          - 'null'
          format: uuid
        runId:
          type:
          - string
          - 'null'
          format: uuid
        model:
          type:
          - string
          - 'null'
    InteractionRecord:
      allOf:
      - $ref: '#/components/schemas/InteractionRecordCreate'
      - type: object
        required:
        - id
        - actor
        - recordedAt
        properties:
          id:
            type: string
            format: uuid
          actor:
            $ref: '#/components/schemas/ActorRef'
          recordedAt:
            type: string
            format: date-time
          eventHash:
            type:
            - string
            - 'null'
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Action denied by authority or policy
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict with current state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Request is valid but cannot be governed or executed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
