components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 client credentials. Exchange an API key (client_id is the key id, client_secret is the key) for a one-hour EdDSA access token with the same or narrower scope. The key itself is also accepted as the bearer credential.
      flows:
        clientCredentials:
          tokenUrl: https://auth.id-me.ai/oauth2/token
          scopes:
            igl.read: Read governed intelligence
            igl.write: Create or update governed intelligence
            igl.execute: Execute queries, agents, and workflows
            igl.admin: Manage policies, authority, and platform configuration
    apiKey:
      type: apiKey
      in: header
      name: X-IGL-API-Key
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Caller-provided correlation identifier.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Caller-chosen key for a mutation. Repeating the request with the same key and body replays the stored response; the same key with a different body is refused with 409.
    TenantId:
      name: X-IGL-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Governed tenant boundary.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  headers:
    XRequestId:
      description: Correlation identifier for the request.
      schema:
        type: string
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        traceId:
          type: string
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    Violation:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    PageInfo:
      type: object
      required:
      - hasMore
      properties:
        nextCursor:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
    ActorRef:
      type: object
      required:
      - identityId
      properties:
        identityId:
          type: string
          format: uuid
        organizationId:
          type:
          - string
          - 'null'
          format: uuid
        roleIds:
          type: array
          items:
            type: string
            format: uuid
    SourceRef:
      type: object
      required:
      - sourceId
      - sourceType
      properties:
        sourceId:
          type: string
        sourceType:
          type: string
          enum:
          - document
          - database
          - api
          - web
          - email
          - transcript
          - human
          - system
          - other
        uri:
          type:
          - string
          - 'null'
          format: uri-reference
        title:
          type:
          - string
          - 'null'
        retrievedAt:
          type:
          - string
          - 'null'
          format: date-time
        contentHash:
          type:
          - string
          - 'null'
        locator:
          type:
          - string
          - 'null'
          description: Page, line, paragraph, timestamp, row, or other pinpoint locator.
    Provenance:
      type: object
      required:
      - createdAt
      - createdBy
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/ActorRef'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
        model:
          type:
          - string
          - 'null'
        workflowRunId:
          type:
          - string
          - 'null'
          format: uuid
        policyDecisionIds:
          type: array
          items:
            type: string
            format: uuid
    IdentityType:
      type: string
      enum:
      - person
      - organization
      - system
      - agent
      - asset
      - place
      - document
      - program
      - course
      - product
      - other
    Identity:
      type: object
      required:
      - id
      - type
      - displayName
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/IdentityType'
        displayName:
          type: string
        aliases:
          type: array
          items:
            type: string
        externalIds:
          type: object
          additionalProperties:
            type: string
        attributes:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
          - active
          - inactive
          - merged
          - restricted
        confidence:
          type: number
          minimum: 0
          maximum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        provenance:
          $ref: '#/components/schemas/Provenance'
    IdentityCreate:
      type: object
      required:
      - type
      - displayName
      properties:
        type:
          $ref: '#/components/schemas/IdentityType'
        displayName:
          type: string
        aliases:
          type: array
          items:
            type: string
        externalIds:
          type: object
          additionalProperties:
            type: string
        attributes:
          type: object
          additionalProperties: true
        source:
          $ref: '#/components/schemas/SourceRef'
    IdentityContextAppend:
      type: object
      required:
      - kind
      - value
      properties:
        kind:
          type: string
          enum:
          - interest
          - goal
          - project
          - relationship
          - expertise
          - preference
          - constraint
          - observation
          - other
        value: {}
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          $ref: '#/components/schemas/SourceRef'
    Relationship:
      type: object
      required:
      - id
      - fromId
      - type
      - toId
      - status
      properties:
        id:
          type: string
          format: uuid
        fromId:
          type: string
          format: uuid
        type:
          type: string
        toId:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - directed
          - undirected
          default: directed
        attributes:
          type: object
          additionalProperties: true
        effectiveFrom:
          type:
          - string
          - 'null'
          format: date-time
        effectiveTo:
          type:
          - string
          - 'null'
          format: date-time
        confidence:
          type: number
          minimum: 0
          maximum: 1
