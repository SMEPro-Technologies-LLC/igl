      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorityDecision'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorityEvaluateRequest'
      security:
      - oauth2:
        - igl.execute
  /knowledge/entities:
    post:
      summary: Create a governed knowledge entity
      operationId: createKnowledgeEntity
      tags:
