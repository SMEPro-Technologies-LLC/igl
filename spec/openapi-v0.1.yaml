              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipPage'
      parameters:
      - *id001
      - *id002
      - name: entityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: depth
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 3
          default: 1
  /query:
    post:
      summary: Run a governed intelligence query
      operationId: runQuery
      tags:
      - Intelligence
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligenceResponse'
        '202':
          description: Accepted for asynchronous execution
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntelligenceRequest'
            example:
              question: Which obligations are due for this asset in the next 30 days, who owns them, and what evidence is
                required?
              actor:
                identityId: b9d4507a-36ce-4d1b-970d-d85797141ff7
                organizationId: e7bcde63-4ccd-4594-aa64-6de1cce72ae8
                roleIds:
                - 07e7a6c8-30aa-4a22-85ba-61c3f024e401
              scope:
                assetId: 95dcad56-20a5-4b65-b8e7-6bb3e91510a2
              filters:
              - field: dueDate
                operator: between
                value:
                - '2026-10-06'
                - '2026-11-05'
              maxHops: 4
              requireCitations: true
              minimumConfidence: 0.8
      security:
      - oauth2:
        - igl.execute
  /research:
    post:
      summary: Run governed research
      operationId: runResearch
      tags:
      - Intelligence
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligenceResponse'
        '202':
          description: Accepted for asynchronous execution
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntelligenceRequest'
      security:
      - oauth2:
        - igl.execute
  /crosswalk:
    post:
      summary: Run a multi-hop crosswalk
      operationId: runCrosswalk
      tags:
      - Intelligence
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligenceResponse'
        '202':
          description: Accepted for asynchronous execution
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntelligenceRequest'
            example:
              question: Map the relationships among sites, products, manufacturers, witnesses, experts, and treaters.
              scope:
                matterIndependent: true
                domains:
                - toxic-tort
                - silica
              filters:
              - field: relationship.status
                operator: in
                value:
                - proposed
