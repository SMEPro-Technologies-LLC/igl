components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 client credentials for workload access and authorization code for user-delegated access.
      flows:
        clientCredentials:
          tokenUrl: https://auth.igl.example.com/oauth2/token
          scopes:
            igl.read: Read governed intelligence
            igl.write: Create or update governed intelligence
            igl.execute: Execute queries, agents, and workflows
            igl.admin: Manage policies, authority, and platform configuration
        authorizationCode:
          authorizationUrl: https://auth.igl.example.com/oauth2/authorize
          tokenUrl: https://auth.igl.example.com/oauth2/token
          scopes:
            igl.read: Read governed intelligence
            igl.write: Create or update governed intelligence
            igl.execute: Execute queries, agents, and workflows
    apiKey:
      type: apiKey
      in: header
      name: X-IGL-API-Key
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Caller-provided correlation identifier.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Required by clients when safely retrying mutation requests.
    TenantId:
      name: X-IGL-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Governed tenant boundary.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  headers:
    XRequestId:
      description: Correlation identifier for the request.
      schema:
        type: string
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        traceId:
          type: string
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    Violation:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    PageInfo:
      type: object
      required:
      - hasMore
      properties:
        nextCursor:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
    ActorRef:
      type: object
      required:
      - identityId
      properties:
        identityId:
          type: string
          format: uuid
        organizationId:
          type:
          - string
          - 'null'
          format: uuid
        roleIds:
          type: array
          items:
            type: string
            format: uuid
    SourceRef:
      type: object
      required:
      - sourceId
      - sourceType
      properties:
        sourceId:
          type: string
        sourceType:
          type: string
          enum:
          - document
          - database
          - api
          - web
          - email
          - transcript
          - human
          - system
          - other
        uri:
          type:
          - string
          - 'null'
          format: uri-reference
        title:
          type:
          - string
          - 'null'
        retrievedAt:
          type:
          - string
          - 'null'
          format: date-time
        contentHash:
          type:
          - string
          - 'null'
        locator:
          type:
          - string
          - 'null'
          description: Page, line, paragraph, timestamp, row, or other pinpoint locator.
