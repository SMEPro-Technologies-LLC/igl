      summary: Find governed multi-hop paths
      operationId: findGraphPaths
      tags:
      - Graph
      responses:
        '200':
          description: Matching graph paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GraphPath'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id010
      requestBody:
        required: true
