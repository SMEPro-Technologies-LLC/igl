        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters:
      - *id001
      - *id002
      - *id009
      - name: identityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityContextAppend'
      security:
      - oauth2:
        - igl.write
  /identities/{identityId}/relationships:
    get:
      summary: List identity relationships
      operationId: listIdentityRelationships
      tags:
