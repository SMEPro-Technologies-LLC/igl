openapi: 3.1.0
info:
  title: IGL Governed Identity Platform API
  version: 0.1.0
  summary: Transform identity into governed intelligence.
  description: 'Proposed API contract for Identity Governed Logic (IGL). The API exposes governed identity, authority, knowledge,
    policy, evidence, outcome, graph, query, research, agent, workflow, and audit services. It is model-agnostic: reasoning
    providers can be changed without changing the governed intelligence contract.'
  contact:
    name: SMEPro Technologies, LLC
    url: https://www.smeprotech.com
  license:
    name: Proprietary
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: https://api.igl.example.com/v1
  description: Production placeholder
- url: https://sandbox.igl.example.com/v1
  description: Sandbox placeholder
tags:
- name: Identity
  description: Resolve identities, context, and relationships.
- name: Authority
  description: Evaluate access, roles, delegations, and decision authority.
- name: Knowledge
  description: Create and retrieve governed entities and facts.
- name: Policy
  description: Create policies and evaluate governed actions.
- name: Evidence
  description: Capture provenance, citations, corroboration, and findings.
- name: Outcomes
  description: Record decisions, actions, measurements, and feedback.
- name: Graph
  description: Traverse and manage governed graph relationships.
- name: Intelligence
  description: Run governed queries, research, crosswalks, and investigations.
- name: Agents
  description: Register and invoke governed agents.
- name: Workflows
  description: Define and run governed workflows.
- name: Audit
  description: Retrieve immutable activity and runtime receipts.
- name: System
  description: Service health and capability discovery.
security:
- oauth2:
  - igl.read
paths:
  /health:
    get:
      summary: Check service health
      operationId: getHealth
      tags:
      - System
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /capabilities:
    get:
      summary: Discover platform capabilities
      operationId: getCapabilities
      tags:
      - System
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters: &id010
      - &id001
        $ref: '#/components/parameters/TenantId'
      - &id002
        $ref: '#/components/parameters/RequestId'
  /identities:
    get:
      summary: List or search identities
      operationId: listIdentities
      tags:
      - Identity
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - *id001
      - *id002
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: q
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/IdentityType'
    post:
      summary: Create an identity
      operationId: createIdentity
      tags:
      - Identity
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400': &id003
          $ref: '#/components/responses/BadRequest'
        '401': &id004
          $ref: '#/components/responses/Unauthorized'
        '403': &id005
          $ref: '#/components/responses/Forbidden'
        '409': &id006
          $ref: '#/components/responses/Conflict'
        '422': &id007
          $ref: '#/components/responses/Unprocessable'
        '429': &id008
          $ref: '#/components/responses/TooManyRequests'
      parameters: &id011
      - *id001
      - *id002
      - &id009
        $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityCreate'
      security:
      - oauth2:
        - igl.write
      - apiKey: []
  /identities/{identityId}:
    get:
      summary: Get an identity
      operationId: getIdentity
      tags:
      - Identity
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - *id001
      - *id002
      - name: identityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update identity attributes
      operationId: updateIdentity
      tags:
      - Identity
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - *id001
      - *id002
      - *id009
      - name: identityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: true
      security:
      - oauth2:
        - igl.write
      - apiKey: []
  /identities/{identityId}/context:
    post:
      summary: Append governed identity context
      operationId: appendIdentityContext
      tags:
