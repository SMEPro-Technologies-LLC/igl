      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeEntity'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - *id001
      - *id002
      - name: entityId
