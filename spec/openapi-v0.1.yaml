          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorityDecision'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyEvaluateRequest'
      security:
      - oauth2:
        - igl.execute
  /evidence:
    get:
      summary: List evidence
      operationId: listEvidence
      tags:
      - Evidence
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePage'
      parameters:
      - *id001
      - *id002
      - name: status
        in: query
        schema:
          type: string
      - name: kind
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    post:
      summary: Create evidence or a finding
      operationId: createEvidence
      tags:
      - Evidence
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceCreate'
      security:
      - oauth2:
        - igl.write
  /evidence/{evidenceId}:
    get:
