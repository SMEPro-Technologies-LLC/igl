      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipPage'
      parameters:
      - *id001
      - *id002
      - name: identityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /authority/evaluate:
    post:
      summary: Evaluate authority for an action
      operationId: evaluateAuthority
