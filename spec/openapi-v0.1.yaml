      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeEntity'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeEntityCreate'
      security:
      - oauth2:
        - igl.write
  /knowledge/entities/{entityId}:
    get:
      summary: Get a knowledge entity
      operationId: getKnowledgeEntity
      tags:
