      summary: Corroborate or contradict evidence
      operationId: corroborateEvidence
      tags:
      - Evidence
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters:
      - *id001
      - *id002
      - *id009
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorroborateRequest'
      security:
      - oauth2:
        - igl.write
  /outcomes:
    post:
      summary: Record an outcome
      operationId: createOutcome
      tags:
      - Outcomes
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outcome'
        '400': *id003
        '401': *id004
        '403': *id005
        '409': *id006
        '422': *id007
        '429': *id008
      parameters: *id011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutcomeCreate'
      security:
      - oauth2:
        - igl.write
  /outcomes/{outcomeId}:
    get:
